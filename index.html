<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed</title>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="titulo">Instagram</h1>

                <i class="fa-regular fa-heart"></i>
<!--                 <p class="likes"><strong>234</strong></p>
 -->                <i class="fa-regular fa-comment"></i>
                <!-- <p class="comments"><strong>57</strong></p> -->
                <i class="fa-solid fa-repeat"></i>
                <!-- <p class="shares"><strong>34</strong></p> -->
                <i class="fa-regular fa-paper-plane"></i>
                <!-- <p class="send"><strong>45</strong></p> -->
                <i class="fa-regular fa-bookmark"></i>   
                <p>Explorando nuevos horizontes. #Water #nature</p>
            </div>
        </article>

        <article class="photo-item">
            <div class="photo-header">
                <strong>Coffee Time</strong>

            </div>
            <img src="https://picsum.photos/id/9/600/600" alt="laptop">

                <i class="fa-regular fa-heart"></i>
                <!-- <p class="likes"><strong>1,200</strong></p> -->

                <!-- <p class="comments"><strong>100</strong></p> -->

                <!-- <p class="shares"><strong>158</strong></p> -->

                <i class="fa-regular fa-bookmark"></i>

            </div>
        </article>

        <article class="photo-item">
            <div class="photo-header">
                <strong>Coffee Time</strong>
                <p class="fecha">10/12/2027</p>
            </div>
            <img src="https://picsum.photos/600/600" alt="random">
            <div class="photo-content">
                <i class="fa-regular fa-heart"></i>
               <!--  <p class="likes"><strong>99,999</strong></p> -->

</html>
